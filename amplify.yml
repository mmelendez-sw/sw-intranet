version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
  customRules:
    # After the Lambda Function URL exists, add this BEFORE the SPA catch-all:
    # - source: '/api/<*>'
    #   target: 'https://YOUR_LAMBDA_ID.lambda-url.REGION.on.aws/api/<*>'
    #   status: '200'
    - source: '/<*>'
      target: '/index.html'
      status: '200'
